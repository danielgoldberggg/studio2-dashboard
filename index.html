<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Partner Dashboard — Studio Two</title>
<style>
  :root {
    --bg: #f5efe4;
    --card: #fffaf1;
    --border: #e3d8c3;
    --text: #3b3226;
    --muted: #8a7d68;
    --accent: #b98c4f;
    --green: #6b9e5b;
    --warn: #c99a3d;
    --danger: #b8583f;
    --blue: #5c8a99;
    --pill-bg: #efe4d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; color: #4a3d2b; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: 10px;
  }
  .tabs { display: flex; gap: 6px; }
  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  .filters-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 10px;
  }
  .filter-group { display: flex; align-items: center; gap: 6px; }
  label.filter-label { font-size: 12px; color: var(--muted); }

  select {
    background: var(--pill-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }

  .seg-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg-btn {
    padding: 4px 10px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
  }
  .seg-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .clear-btn {
    padding: 4px 10px;
    border-radius: 16px;
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    cursor: pointer;
    font-size: 12px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .num { font-size: 24px; font-weight: 700; color: #4a3d2b; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; background: #efe4d0; position: sticky; top: 0; }
  tr:hover td { background: #f7efe0; }

  .th-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .th-label { cursor: pointer; user-select: none; }
  .th-label:hover { color: var(--text); }
  .sort-arrow { display: block; font-size: 10px; color: var(--muted); white-space: nowrap; margin-top: 2px; }
  .sort-arrow.active { color: var(--accent); font-weight: 700; }
  .info-btn {
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; color: var(--accent);
    font-size: 10px; font-style: italic; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; border: 1px solid var(--accent); flex: none;
  }
  .info-btn:hover { background: var(--accent); color: #fff; }
  .info-popover {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    width: 240px;
    background: #fffaf1;
    color: var(--text);
    font-size: 12px;
    font-weight: 400;
    font-style: normal;
    line-height: 1.55;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    box-shadow: 0 10px 24px rgba(59,50,38,0.18);
    z-index: 50;
    cursor: default;
    white-space: normal;
  }
  .info-popover::before {
    content: '';
    position: absolute;
    top: -7px; left: 12px;
    width: 12px; height: 12px;
    background: #fffaf1;
    border-left: 1px solid var(--accent);
    border-top: 1px solid var(--accent);
    transform: rotate(45deg);
  }
  .info-popover.open { display: block; }
  .col-filter, .col-search {
    display: block;
    width: 100%;
    max-width: 130px;
    padding: 4px 6px;
    font-size: 11px;
  }
  .col-search {
    background: var(--pill-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
  }
  .col-search::placeholder { color: var(--muted); }
  .col-filter.active-filter, .col-search.active-filter { border-color: var(--blue); color: var(--blue); font-weight: 600; background: #fff; }

  .pill { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
  .pill.green { background: rgba(107,158,91,0.15); color: var(--green); }
  .pill.yellow { background: rgba(201,154,61,0.18); color: var(--warn); }
  .pill.red { background: rgba(184,88,63,0.15); color: var(--danger); }
  .pill.blue { background: rgba(92,138,153,0.15); color: var(--blue); }

  .bar-wrap { display: flex; align-items: center; gap: 6px; }
  .bar-bg { width: 70px; height: 6px; background: var(--pill-bg); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--blue); }
  .data-flag { color: var(--warn); cursor: help; margin-left: 2px; font-size: 11px; }

  .table-wrap { max-height: 640px; overflow: auto; border-radius: 10px; }
  .muted { color: var(--muted); }
  .count-badge { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  .demo-toggle {
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
  }
  .demo-toggle:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chevron { font-size: 10px; }

  .demo-panel-row td { background: #f3ead9; padding: 14px 20px; }
  .demo-panel-hint { width: 100%; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .demo-panel { display: flex; flex-wrap: wrap; gap: 8px; }
  .demo-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 20px;
    font-size: 12px; background: #fff; border: 1px solid var(--border);
    cursor: pointer; user-select: none; transition: transform 0.05s ease;
  }
  .demo-chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .demo-chip:active { transform: translateY(0); }
  .demo-chip.done { border-color: var(--green); color: var(--green); background: rgba(107,158,91,0.08); }
  .demo-chip.todo { color: var(--muted); }
  .demo-dot { font-weight: 700; }
  .demo-duration { color: var(--muted); }
  .demo-auto-badge { display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--accent); border-radius:3px; padding:0 4px; vertical-align:middle; }
  .demo-empty-note { width: 100%; font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; }
</style>
</head>

<script>
let DATA = [];
let state = {
  view: 'dept', tl: null, psm: null,
  sortKey: 'active_premiums', sortDir: 'desc',
  segTrend: null, segEngagement: null, segSize: null, segPlatform: null,
  colFilters: {}, expandedIds: new Set()
};

const DEMO_CATALOG = [
  { name: 'Getting Started: Aria', duration: 10, mondayLabel: 'Getting Started: Aria' },
  { name: 'Getting Started: Blank & Template', duration: 5, mondayLabel: 'Getting Started: Blank' },
  { name: 'Tour for Studio Editor Partners', duration: 25, mondayLabel: 'Studio Tour' },
  { name: 'Tour for Classic Editor Partners', duration: 30, mondayLabel: 'Classic Tour' },
  { name: 'SEO & Accessibility', duration: 10, mondayLabel: 'SEO' },
  { name: 'New Design Tools', duration: 10, mondayLabel: 'Design' },
  { name: 'Context & Data', duration: 15, mondayLabel: 'Context & Data' },
  { name: 'Code', duration: 15, mondayLabel: 'Coding' },
];

// Returns the set of demo names (from DEMO_CATALOG) that the Monday.com
// board's "Demos Held" column says were delivered for this account. That
// column is meant to auto-fill from Gong, so once it's populated there this
// picks it up on the next data refresh with no dashboard changes needed.
function mondayDeliveredDemos(r) {
  const raw = r.monday && r.monday.demos_held;
  if (!raw) return new Set();
  const labels = raw.split(',').map(s => s.trim()).filter(Boolean);
  const names = DEMO_CATALOG.filter(d => labels.includes(d.mondayLabel)).map(d => d.name);
  return new Set(names);
}

// Delivered demos per account, keyed by account id. Starts empty — no delivery
// log exists yet in Salesforce (see Product_Session_Demo__c proposal). Until that
// exists, clicking a demo chip below marks it delivered and saves it in this
// browser's localStorage, so PSMs can track it here in the meantime.
const DEMOS_KEY = 'studioTwoDemosDelivered';
let DEMOS_DELIVERED = {};
try { DEMOS_DELIVERED = JSON.parse(localStorage.getItem(DEMOS_KEY)) || {}; } catch (e) { DEMOS_DELIVERED = {}; }
// Migrate legacy format (plain array of demo name strings, no date) to
// [{name, deliveredAt}] so we can tell whether a follow-up happened since.
Object.keys(DEMOS_DELIVERED).forEach(id => {
  DEMOS_DELIVERED[id] = (DEMOS_DELIVERED[id] || []).map(d =>
    typeof d === 'string' ? { name: d, deliveredAt: null } : d
  );
});
function saveDemosDelivered() {
  localStorage.setItem(DEMOS_KEY, JSON.stringify(DEMOS_DELIVERED));
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function daysBetween(isoA, isoB) {
  return Math.round((new Date(isoB) - new Date(isoA)) / 86400000);
}
// Recomputes each account's follow-up status from its delivered demos + last
// Salesforce activity date. Call after any change to DEMOS_DELIVERED.
function refreshFollowupFields() {
  const today = todayISO();
  DATA.forEach(r => {
    const manual = DEMOS_DELIVERED[r.id] || [];
    const autoNames = mondayDeliveredDemos(r);
    const manualNames = new Set(manual.map(d => d.name));
    const totalDelivered = new Set([...manualNames, ...autoNames]).size;
    const dates = manual.map(d => d.deliveredAt).filter(Boolean).sort();
    if (!totalDelivered) {
      r.followupStatus = 'No demo yet'; r.followupDays = null; return;
    }
    if (!dates.length) {
      r.followupStatus = 'Unknown (no date)'; r.followupDays = null; return;
    }
    const firstDemoDate = dates[0];
    const daysSinceDemo = daysBetween(firstDemoDate, today);
    const hadActivityAfter = r.last_activity && r.last_activity >= firstDemoDate;
    if (hadActivityAfter) { r.followupStatus = 'OK'; r.followupDays = daysSinceDemo; }
    else if (daysSinceDemo <= 7) { r.followupStatus = 'Too soon'; r.followupDays = daysSinceDemo; }
    else { r.followupStatus = 'Needs follow-up'; r.followupDays = daysSinceDemo; }
  });
}

    info: "How many Base44 apps (Wix's AI app builder) this partner's end clients have built, and how many of those apps are on a paid plan vs. free ('zero'). Joined from prod.partners.partner_base44_app_dim + partner_base44_organization_dim via salesforce_account_id. 'No data' means this account has no Base44 apps at all (not the same as confirmed zero usage)."
  },
  {

    info: "Number of this partner's sites built with Wix Headless. Computed by joining site-level data (prod.headless.headless_base44_sites_dim) through prod.partners.partner_site_relation_dim (site -> Wix account) and prod.partners.salesforce_wix_accounts_dim (Wix account -> Salesforce account). 'No data' means no Headless sites were found via this join - for accounts not in this list, Headless adoption could not be confirmed either way with current data."
  }
];

function sizeBucket(active) {
  if (active === null || active === undefined) return 'Unknown';
  if (active < 20) return 'Small (<20)';
  if (active < 100) return 'Medium (20-100)';
  return 'Large (100+)';
}
function platformBucket(pct) {
  if (pct === null || pct === undefined) return 'Unknown';
  if (pct < 15) return 'Classic-heavy';
  if (pct < 60) return 'Mixed';
  return 'Studio-heavy';
}
function engagementBucket(days) {
  if (days === null || days === undefined) return 'No data';
  if (days <= 14) return 'Active';
  if (days <= 45) return 'Weakening';
  return 'Not talking';
}
function trendBucket(trend) {
  if (!trend) return 'Unknown';
  return trend;
}
function enrich(r) {
  r.sizeBucket = sizeBucket(r.active_premiums);
  r.platformBucket = platformBucket(r.studio_pct);
  r.engagementBucket = engagementBucket(r.days_since_activity);
  r.trendBucket = trendBucket(r.trend);
  const md = r.monday;
  const ai = r.aiCuriosity;
  if (md && md.ai_sentiment) {

  } else {
    r.aiStatusDisplay = 'Not assessed';

  r.aiStudioScore = ai ? ai.studioScore : null;

}

function buildSegButtons(containerId, values, stateKey, renderFn) {
  renderFn = renderFn || render;
  const el = document.getElementById(containerId);
  el.innerHTML = values.map(v => `<div class="seg-btn" data-val="${v}">${v}</div>`).join('');
  el.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.val;
      if (state[stateKey] === val) {
        state[stateKey] = null;
        btn.classList.remove('active');
      } else {
        el.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        state[stateKey] = val;
        btn.classList.add('active');
      }
      renderFn();
    });
  });
}

    if (col.filter && col.filterType === 'search') {
      const currentVal = state.colFilters[filterKey] || '';
      filterControl = `<input type="text" class="col-search" data-filter-key="${filterKey}" placeholder="Search..." value="${currentVal}" />`;
    } else if (col.filter) {
      const values = [...new Set(DATA.map(x => x[filterKey]).filter(v => v !== null && v !== undefined && v !== ''))].sort();
      const options = `<option value="">All</option>` + values.map(v => `<option value="${v}">${v}</option>`).join('');
      filterControl = `<select class="col-filter" data-filter-key="${filterKey}">${options}</select>`;
    }
    return `
      <th>
        <div class="th-row">
          <span class="th-label" data-key="${col.key}" style="${col.sortable === false ? 'cursor:default' : ''}">${col.label}${col.sortable === false ? '' : `<span class="sort-arrow" data-arrow-for="${col.key}"></span>`}</span>
          <span class="info-btn" data-key="${col.key}">i
            <div class="info-popover" data-popover="${col.key}">${col.info}</div>
          </span>
        </div>
        ${filterControl}
      </th>
    `;
  }).join('');

  headerRow.querySelectorAll('.th-label').forEach(el => {
    const col = COLUMNS.find(c => c.key === el.dataset.key);
    if (col && col.sortable === false) return;
    el.addEventListener('click', () => {
      const key = el.dataset.key;
      if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = key; state.sortDir = 'desc'; }
      render();
    });
  });

  headerRow.querySelectorAll('.info-btn').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const pop = el.querySelector('.info-popover');
      const wasOpen = pop.classList.contains('open');
      document.querySelectorAll('.info-popover').forEach(p => p.classList.remove('open'));
      if (!wasOpen) pop.classList.add('open');
    });
  });

  headerRow.querySelectorAll('.col-search').forEach(el => {
    el.addEventListener('click', (e) => e.stopPropagation());
    el.addEventListener('input', () => {
      const fk = el.dataset.filterKey;
      state.colFilters[fk] = el.value || null;
      el.classList.toggle('active-filter', !!el.value);
      render();
    });
  });

  headerRow.querySelectorAll('.col-filter').forEach(el => {
    el.addEventListener('click', (e) => e.stopPropagation());
    el.addEventListener('change', () => {
      const fk = el.dataset.filterKey;
      state.colFilters[fk] = el.value || null;
      el.classList.toggle('active-filter', !!el.value);
      if (fk === 'tl') refreshOwnerOptions();
      render();
    });
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.info-popover').forEach(p => p.classList.remove('open'));
});

function refreshOwnerOptions() {
  const selectedTl = state.colFilters.tl;
  const psms = [...new Set(DATA.filter(x => !selectedTl || x.tl === selectedTl).map(x => x.owner).filter(Boolean))].sort();
  // No Team Lead selected (back to "All") -> always reset PSM to "All" too, so
  // picking "All" on Team Lead immediately shows everyone instead of leaving a
  // stale PSM filter from a different team in place.
  const keepCurrent = selectedTl && psms.includes(state.colFilters.owner) ? state.colFilters.owner : '';
  state.colFilters.owner = keepCurrent || null;
  document.querySelectorAll('.col-filter[data-filter-key="owner"]').forEach(ownerSel => {
    ownerSel.innerHTML = `<option value="">All</option>` + psms.map(p => `<option value="${p}">${p}</option>`).join('');
    ownerSel.value = keepCurrent;
    ownerSel.classList.toggle('active-filter', !!keepCurrent);
  });
}

function init() {
  refreshFollowupFields();
  buildHeaderRow();

  document.querySelector('.col-filter[data-filter-key="tl"]').addEventListener('change', () => {
    refreshOwnerOptions();
    render();
  });

  buildSegButtons('trendBtns', [...new Set(DATA.map(x => x.trendBucket))].sort(), 'segTrend');
  buildSegButtons('engagementBtns', ['Active','Weakening','Not talking','No data'], 'segEngagement');
  buildSegButtons('sizeBtns', ['Small (<20)','Medium (20-100)','Large (100+)'], 'segSize');
  buildSegButtons('platformBtns', ['Classic-heavy','Mixed','Studio-heavy','Unknown'], 'segPlatform');

  document.getElementById('clearFilters').addEventListener('click', () => {
    state.segTrend = null; state.segEngagement = null; state.segSize = null; state.segPlatform = null;
    state.colFilters = {};
    document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.col-filter, .col-search').forEach(s => { s.value = ''; s.classList.remove('active-filter'); });
    refreshOwnerOptions();
    render();
  });

  document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleString('en-US');
  render();
}

function aiStatusPill(status) {
  if (status === 'AI Curious') return `<span class="pill green">AI Curious</span>`;
  if (status === 'AI Resistant') return `<span class="pill red">AI Resistant</span>`;
  return `<span class="pill blue">Not assessed</span>`;
}

function followupPill(status, days) {
  if (status === 'Needs follow-up') return `<span class="pill red">Needs follow-up (${days}d)</span>`;
  if (status === 'OK') return `<span class="pill green">OK (${days}d since demo)</span>`;
  if (status === 'Too soon') return `<span class="pill yellow">Too soon (${days}d)</span>`;
  if (status === 'Unknown (no date)') return `<span class="pill blue">No date logged</span>`;
  return `<span class="muted">No demo yet</span>`;
}

function base44Pill(display) {
  if (display === 'No data') return `<span class="muted">No data</span>`;
  return `<span class="pill green">${display}</span>`;
}

function headlessPill(display) {
  if (display === 'No data') return `<span class="muted">No data</span>`;
  return `<span class="pill green">${display}</span>`;
}

function getScoped() {
  let rows = DATA;
  if (state.segTrend) rows = rows.filter(x => x.trendBucket === state.segTrend);
  if (state.segEngagement) rows = rows.filter(x => x.engagementBucket === state.segEngagement);
  if (state.segSize) rows = rows.filter(x => x.sizeBucket === state.segSize);
  if (state.segPlatform) rows = rows.filter(x => x.platformBucket === state.segPlatform);
  const searchKeys = new Set(COLUMNS.filter(c => c.filterType === 'search').map(c => c.filterKey || c.key));
  Object.entries(state.colFilters).forEach(([key, val]) => {
    if (!val) return;
    if (searchKeys.has(key)) {
      const needle = val.toLowerCase();
      rows = rows.filter(x => String(x[key] ?? '').toLowerCase().includes(needle));
    } else {
      rows = rows.filter(x => String(x[key]) === val);
    }
  });
  return rows;
}

function trendPill(trend) {
  if (!trend) return `<span class="pill blue">Unknown</span>`;
  if (/increase/i.test(trend) && !/not/i.test(trend)) return `<span class="pill green">${trend}</span>`;
  if (/not increasing/i.test(trend)) return `<span class="pill yellow">${trend}</span>`;
  return `<span class="pill blue">${trend}</span>`;
}

function activityPill(days) {
  if (days === null || days === undefined) return `<span class="pill red">No data</span>`;
  if (days <= 14) return `<span class="pill green">Active (${days}d)</span>`;
  if (days <= 45) return `<span class="pill yellow">Weakening (${days}d)</span>`;
  return `<span class="pill red">Not talking (${days}d)</span>`;
}

function studioBar(pct) {
  if (pct === null || pct === undefined) return `<span class="muted">—</span>`;
  const isOver = pct > 100;
  const barWidth = Math.min(pct, 100);
  const flag = isOver
    ? `<span class="data-flag" title="Unexpected: Studio Premiums exceed All-Time Premiums for this account, which shouldn't be mathematically possible. Worth a manual check in Salesforce. Bar is capped at 100%.">⚠</span>`
    : '';
  return `<div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${barWidth}%"></div></div><span>${pct}%${flag}</span></div>`;
}

function updateSortIndicators() {
  document.querySelectorAll('.sort-arrow').forEach(el => {
    const key = el.dataset.arrowFor;
    const col = COLUMNS.find(c => c.key === key);
    const isNumber = col && col.type === 'number';
    if (key === state.sortKey) {
      const ascLabel = isNumber ? 'Low-High' : 'A-Z';
      const descLabel = isNumber ? 'High-Low' : 'Z-A';
      el.textContent = state.sortDir === 'asc' ? `▲ ${ascLabel}` : `▼ ${descLabel}`;
      el.classList.add('active');
    } else {
      el.textContent = '⇅';
      el.classList.remove('active');
    }
  });
}

function render() {
  updateSortIndicators();
  const rows = getScoped();
  const scopeLabelEl = document.getElementById('scopeLabel');
  const parts = [];
  if (state.colFilters.tl) parts.push(`Team Lead: ${state.colFilters.tl}`);
  if (state.colFilters.owner) parts.push(`Partner Success Manager: ${state.colFilters.owner}`);
  scopeLabelEl.textContent = parts.length
    ? `${parts.join(' — ')} — ${rows.length} accounts`
    : `Department View — ${rows.length} of ${DATA.length} BoB accounts`;

  const totalActive = rows.reduce((s,r) => s + (r.active_premiums||0), 0);
  const withPct = rows.filter(r=>r.studio_pct!==null);
  const avgStudioPct = withPct.length ? Math.round(withPct.reduce((s,r)=> s+(r.studio_pct||0),0) / withPct.length) : 0;
  const notTalking = rows.filter(r => r.engagementBucket === 'Not talking').length;
  const growing = rows.filter(r => /increase/i.test(r.trend||'') && !/not/i.test(r.trend||'')).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${rows.length}</div><div class="label">Accounts in scope</div></div>
    <div class="stat"><div class="num">${totalActive}</div><div class="label">Total active premiums</div></div>
    <div class="stat"><div class="num">${avgStudioPct}%</div><div class="label">Avg % Studio</div></div>
    <div class="stat"><div class="num" style="color:var(--danger)">${notTalking}</div><div class="label">Not talking (45+ days)</div></div>
    <div class="stat"><div class="num" style="color:var(--green)">${growing}</div><div class="label">Growing trend</div></div>
  `;

  const sorted = [...rows].sort((a,b) => {
    let av = a[state.sortKey], bv = b[state.sortKey];
    if (av === null || av === undefined) av = -Infinity;
    if (bv === null || bv === undefined) bv = -Infinity;
    if (typeof av === 'string') return state.sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return state.sortDir === 'asc' ? av - bv : bv - av;
  });

  document.getElementById('countBadge').textContent = `Showing ${sorted.length} accounts`;
  document.getElementById('tbody').innerHTML = sorted.map(r => {
    const delivered = DEMOS_DELIVERED[r.id] || [];
    const autoNames = mondayDeliveredDemos(r);
    const deliveredCount = new Set([...delivered.map(d => d.name), ...autoNames]).size;
    const isOpen = state.expandedIds.has(r.id);
    return `
    <tr class="acc-row" data-id="${r.id}">
      <td>${r.name}</td>
      <td class="muted">${r.tl||'—'}</td>
      <td class="muted">${r.owner||'—'}</td>
      <td>${r.all_time_premiums ?? '—'}</td>
      <td>${r.active_premiums ?? '—'}</td>
      <td>${r.studio_premiums ?? '—'}</td>
      <td>${aiStatusPill(r.aiStatusDisplay)}</td>
      <td>${r.nextDemoDate ? r.nextDemoDate : '<span class="muted">Not scheduled</span>'}</td>
      <td>${trendPill(r.trend)}</td>
      <td>${activityPill(r.days_since_activity)}</td>
      <td>
        <button class="demo-toggle" data-id="${r.id}">
          ${deliveredCount}/${DEMO_CATALOG.length} <span class="chevron">${isOpen ? '▴' : '▾'}</span>
        </button>
      </td>
      <td>${followupPill(r.followupStatus, r.followupDays)}</td>
      <td>${base44Pill(r.base44Display)}</td>
      <td>${headlessPill(r.headlessDisplay)}</td>
    </tr>
    <tr class="demo-panel-row" data-panel-for="${r.id}" style="display:${isOpen ? 'table-row' : 'none'}">
      <td colspan="${COLUMNS.length}">
        <div class="demo-panel">
          <div class="demo-panel-hint">Click a demo to mark it delivered / not delivered:</div>
          ${DEMO_CATALOG.map(d => {
            const isAuto = autoNames.has(d.name);
            const isManual = delivered.some(dd => dd.name === d.name);
            const isDelivered = isAuto || isManual;
            const sourceNote = isAuto ? ' title="Auto-synced from the Monday.com board (Demos Held)"' : '';
            return `<div class="demo-chip ${isDelivered ? 'done' : 'todo'}" data-id="${r.id}" data-demo="${d.name}"${sourceNote}>
              <span class="demo-dot">${isDelivered ? '✓' : '—'}</span>
              ${d.name}${isAuto ? ' <span class="demo-auto-badge">M</span>' : ''} <span class="demo-duration">(${d.duration}min)</span>
            </div>`;
          }).join('')}
          ${deliveredCount === 0 ? `<div class="demo-empty-note">No demos logged yet for this account. Demos marked "M" sync automatically from the team's Monday.com board (Demos Held column); click a demo here to also log it manually with today's date.</div>` : ''}
        </div>
      </td>
    </tr>
  `;
  }).join('');

  document.querySelectorAll('.demo-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (state.expandedIds.has(id)) state.expandedIds.delete(id);
      else state.expandedIds.add(id);
      render();
    });
  });

  document.querySelectorAll('.demo-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const id = chip.dataset.id;
      const demo = chip.dataset.demo;
      const list = DEMOS_DELIVERED[id] || [];
      const idx = list.findIndex(d => d.name === demo);
      if (idx === -1) list.push({ name: demo, deliveredAt: todayISO() });
      else list.splice(idx, 1);
      DEMOS_DELIVERED[id] = list;
      saveDemosDelivered();
      refreshFollowupFields();
      render();
    });
  });
}
</script>

</body>
</html>
